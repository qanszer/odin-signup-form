<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="brief description about the website. this text matters because it often appears in Google search results under your page title, so it helps people decide whether to click on your site.">
    <link rel="preload" href="fonts/Norse-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Odin Project: Sign-up Form</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <img class="background" src="nord-night-city.png" alt="sidebar logo background">
            <div class="sidebar-logo-container">
                <img class="logo-image" src="./odin-lined-logo.png" draggable="false">
                <div class="logo-text">ODIN</div>
            </div>
        </div>
        <div class="mainbar">
            <div class="header">
                <p class="header-text">
                    This is not a real online service! You know you need something<br>like this in your life to help you realize your deepest dreams.<br>Sign up <em>now</em> to get started.
                    <br><br>
                    You <em>know</em> you want to.
                </p>
            </div>
            <div class="input-form">
                <form id="signup" action="" method="POST" class="standard-form">
                    <header class="form-header">
                        <h2>Let's do this!</h2>
                    </header>
                    <div class="form-row">
                        <div class="form-item">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first_name" required>
                        </div>
                        <div class="form-item">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last_name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label for="email">EMAIL</label>
	                        <input type="email" id="email" name="email" required placeholder="yourname@example.com">
                        </div>
                        <div class="form-item">
		                    <label for="phone">PHONE NUMBER</label>
                            <input type="tel" id="phone" name="phone" pattern="[0-9]+" title="Please enter numbers only.">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label for="ref-password">PASSWORD</label>
		                    <input type="password" id="ref-password" name="ref_password" required>
                        </div>
                        <div class="form-item">
                            <label for="ref-password">CONFIRM PASSWORD</label>
		                    <input type="password" id="ref-password" name="ref_password" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="action-area">
                <button type="submit" form="signup">Create Account</button>
                <p>Already have an account? <span><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&pp=ygUIcmlja3JvbGzSBwkJGgwBhyohjO8%3D" target="_blank" rel="noopener noreferrer">Log in</a></span></p>
            </div>
        </div>
    </div>
</body>
</html>
